<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">MediaHub Data Dictionary</title><desc id="desc">Compact data dictionary listing all MediaHub tables, their purpose, keys, and important constraints.</desc>
  <style>.bg{fill:#f7f9fc}.h{font:700 30px Arial;fill:#14213d}.s{font:16px Arial;fill:#50627a}.th{font:700 14px Arial;fill:#fff}.tx{font:13px Arial;fill:#1d2b3a}.alt{fill:#edf3fa}.line{stroke:#c1cbda;stroke-width:1}</style>
  <rect class="bg" width="1800" height="1260"/><text x="55" y="52" class="h">MediaHub — Data Dictionary</text><text x="55" y="80" class="s">Recommended report summary. Full column definitions are in the Prisma schema and migrations.</text>
  <rect x="55" y="110" width="1690" height="34" fill="#183b68"/><text class="th" x="70" y="133">Table</text><text class="th" x="335" y="133">Purpose</text><text class="th" x="930" y="133">Primary key / foreign keys</text><text class="th" x="1370" y="133">Important rules</text>
  <g class="tx">
    <rect class="alt" x="55" y="144" width="1690" height="54"/><text x="70" y="166">roles</text><text x="335" y="166">Authorisation roles.</text><text x="930" y="166">PK id</text><text x="1370" y="166">name UNIQUE, NOT NULL</text>
    <text x="70" y="220">users</text><text x="335" y="220">Authenticated MediaHub accounts.</text><text x="930" y="220">PK id; FK role_id</text><text x="1370" y="220">email + google_subject UNIQUE; status DEFAULT</text>
    <rect class="alt" x="55" y="234" width="1690" height="54"/><text x="70" y="256">user_sessions</text><text x="335" y="256">Server-side login sessions.</text><text x="930" y="256">PK sid</text><text x="1370" y="256">expire indexed</text>
    <text x="70" y="310">media_types</text><text x="335" y="310">Movie, book, anime, manga type settings.</text><text x="930" y="310">PK id</text><text x="1370" y="310">code and name UNIQUE</text>
    <rect class="alt" x="55" y="324" width="1690" height="54"/><text x="70" y="346">media_items</text><text x="335" y="346">Canonical media catalogue title.</text><text x="930" y="346">PK id; FK media_type_id, created_by_user_id</text><text x="1370" y="346">total_units CHECK ≥ 0; searchable indexes</text>
    <text x="70" y="400">genres</text><text x="335" y="400">Controlled genre vocabulary.</text><text x="930" y="400">PK id</text><text x="1370" y="400">name and slug UNIQUE</text>
    <rect class="alt" x="55" y="414" width="1690" height="54"/><text x="70" y="436">media_genres</text><text x="335" y="436">Many-to-many title/genre bridge.</text><text x="930" y="436">Composite PK/FKs media_item_id, genre_id</text><text x="1370" y="436">Prevents duplicate genre assignment</text>
    <text x="70" y="490">media_units</text><text x="335" y="490">Episodes, chapters, pages, volumes.</text><text x="930" y="490">PK id; FK media_item_id, parent_unit_id</text><text x="1370" y="490">UNIQUE title/unit sequence; CHECKs</text>
    <rect class="alt" x="55" y="504" width="1690" height="54"/><text x="70" y="526">library_entries</text><text x="335" y="526">A user’s tracked title and progress.</text><text x="930" y="526">PK id; FK user_id, media_item_id, current_unit_id</text><text x="1370" y="526">UNIQUE(user_id, media_item_id); rating CHECK</text>
    <text x="70" y="580">progress_events</text><text x="335" y="580">Auditable individual progress changes.</text><text x="930" y="580">PK id; FK library_entry_id, unit_id</text><text x="1370" y="580">new_progress CHECK ≥ 0; date indexes</text>
    <rect class="alt" x="55" y="594" width="1690" height="54"/><text x="70" y="616">sources</text><text x="335" y="616">External API/scraper source registry.</text><text x="930" y="616">PK id</text><text x="1370" y="616">key and name UNIQUE; enabled DEFAULT</text>
    <text x="70" y="670">external_mappings</text><text x="335" y="670">Links a title to a provider identifier.</text><text x="930" y="670">PK id; FK media_item_id, source_id</text><text x="1370" y="670">UNIQUE(source_id, external_id)</text>
    <rect class="alt" x="55" y="684" width="1690" height="54"/><text x="70" y="706">ingestion_jobs</text><text x="335" y="706">A staged discovery/import request.</text><text x="930" y="706">PK id; FK requested_by_user_id, source_id</text><text x="1370" y="706">counts DEFAULT 0 and CHECK ≥ 0</text>
    <text x="70" y="760">ingestion_candidates</text><text x="335" y="760">Normalized provider title awaiting decision.</text><text x="930" y="760">PK id; four FKs: job, source, type, match</text><text x="1370" y="760">UNIQUE per job/source/external ID; confidence CHECK</text>
    <rect class="alt" x="55" y="774" width="1690" height="54"/><text x="70" y="796">recommendations</text><text x="335" y="796">Ranked title suggestion for a user.</text><text x="930" y="796">PK id; FK user_id, media_item_id</text><text x="1370" y="796">score CHECK 0..1; user-score index</text>
    <text x="70" y="850">audit_logs</text><text x="335" y="850">Immutable operational change record.</text><text x="930" y="850">PK id; FK actor_user_id NULL</text><text x="1370" y="850">entity/date composite index</text>
  </g>
  <g class="line"><line x1="55" y1="144" x2="1745" y2="144"/><line x1="55" y1="198" x2="1745" y2="198"/><line x1="55" y1="288" x2="1745" y2="288"/><line x1="55" y1="378" x2="1745" y2="378"/><line x1="55" y1="468" x2="1745" y2="468"/><line x1="55" y1="558" x2="1745" y2="558"/><line x1="55" y1="648" x2="1745" y2="648"/><line x1="55" y1="738" x2="1745" y2="738"/><line x1="55" y1="828" x2="1745" y2="828"/><line x1="55" y1="882" x2="1745" y2="882"/></g>
</svg>
