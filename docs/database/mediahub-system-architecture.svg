<text x="1640" y="170" class="laneTitle" text-anchor="start">Key design rules</text>
<text x="1640" y="205" class="note" text-anchor="start">• Browser never receives provider secrets</text>
<text x="1640" y="235" class="note" text-anchor="start">• Express enforces auth and ownership</text>
<text x="1640" y="265" class="note" text-anchor="start">• Prisma parameterizes database access</text>
<text x="1640" y="295" class="note" text-anchor="start">• OAuth tokens are AES 256 GCM encrypted</text>
<text x="1640" y="325" class="note" text-anchor="start">• External data is normalized before write</text>
<text x="1640" y="355" class="note" text-anchor="start">• CI must pass before production deploy</text>
</svg>