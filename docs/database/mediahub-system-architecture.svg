<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" role="img" aria-labelledby="title desc">
<title id="title">MediaHub System Architecture and Design</title>
<desc id="desc">Logical architecture showing client, API, middleware, services, Prisma, PostgreSQL, external providers, and GitHub Actions deployment.</desc>
