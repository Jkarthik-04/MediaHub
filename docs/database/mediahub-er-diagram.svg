<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">MediaHub Entity Relationship Diagram</title>
  <desc id="desc">ER diagram showing all sixteen MediaHub database tables and their foreign-key relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#52637a"/></marker>
    <style>
      .bg{fill:#f7f9fc}.title{font:700 30px Arial;fill:#14213d}.sub{font:16px Arial;fill:#50627a}.box{fill:#fff;stroke:#52637a;stroke-width:1.5}.head{fill:#183b68}.name{font:700 16px Arial;fill:#fff}.field{font:13px Arial;fill:#1d2b3a}.pk{font:700 13px Arial;fill:#0e5b45}.fk{font:13px Arial;fill:#8c3e00}.line{stroke:#52637a;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.rel{font:12px Arial;fill:#46566d}.cluster{fill:none;stroke:#aebbd0;stroke-width:1.5;stroke-dasharray:7 5}.clusterlabel{font:700 15px Arial;fill:#52637a}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1220"/>
  <text x="55" y="52" class="title">MediaHub — Entity Relationship Diagram</text>
  <text x="55" y="79" class="sub">PK = Primary Key · FK = Foreign Key · all tables are represented from the implemented PostgreSQL/Prisma schema</text>

  <rect x="35" y="105" width="470" height="430" rx="8" class="cluster"/><text x="52" y="130" class="clusterlabel">Identity and accountability</text>
  <rect x="55" y="155" width="180" height="105" rx="5" class="box"/><rect x="55" y="155" width="180" height="28" rx="5" class="head"/><text x="67" y="174" class="name">roles</text><text x="67" y="203" class="pk">PK id</text><text x="67" y="224" class="field">name (UNIQUE)</text>
  <rect x="280" y="155" width="200" height="150" rx="5" class="box"/><rect x="280" y="155" width="200" height="28" rx="5" class="head"/><text x="292" y="174" class="name">users</text><text x="292" y="203" class="pk">PK id</text><text x="292" y="224" class="fk">FK role_id</text><text x="292" y="245" class="field">google_subject (UNIQUE)</text><text x="292" y="266" class="field">email (UNIQUE), status</text><text x="292" y="287" class="field">display_name, avatar_url</text>
  <rect x="55" y="345" width="180" height="92" rx="5" class="box"/><rect x="55" y="345" width="180" height="28" rx="5" class="head"/><text x="67" y="364" class="name">user_sessions</text><text x="67" y="393" class="pk">PK sid</text><text x="67" y="414" class="field">sess, expire (INDEX)</text>
  <rect x="280" y="345" width="200" height="110" rx="5" class="box"/><rect x="280" y="345" width="200" height="28" rx="5" class="head"/><text x="292" y="364" class="name">audit_logs</text><text x="292" y="393" class="pk">PK id</text><text x="292" y="414" class="fk">FK actor_user_id (nullable)</text><text x="292" y="435" class="field">action, entity_type, entity_id</text>

  <rect x="545" y="105" width="690" height="430" rx="8" class="cluster"/><text x="562" y="130" class="clusterlabel">Media catalogue and personal library</text>
  <rect x="570" y="155" width="190" height="105" rx="5" class="box"/><rect x="570" y="155" width="190" height="28" rx="5" class="head"/><text x="582" y="174" class="name">media_types</text><text x="582" y="203" class="pk">PK id</text><text x="582" y="224" class="field">code, name (UNIQUE)</text><text x="582" y="245" class="field">section, progress_mode</text>
  <rect x="805" y="145" width="210" height="170" rx="5" class="box"/><rect x="805" y="145" width="210" height="28" rx="5" class="head"/><text x="817" y="164" class="name">media_items</text><text x="817" y="193" class="pk">PK id</text><text x="817" y="214" class="fk">FK media_type_id</text><text x="817" y="235" class="fk">FK created_by_user_id</text><text x="817" y="256" class="field">title, normalized_title</text><text x="817" y="277" class="field">cover_url, release_date</text><text x="817" y="298" class="field">origin, review_status</text>
  <rect x="1060" y="155" width="145" height="95" rx="5" class="box"/><rect x="1060" y="155" width="145" height="28" rx="5" class="head"/><text x="1072" y="174" class="name">genres</text><text x="1072" y="203" class="pk">PK id</text><text x="1072" y="224" class="field">name, slug (UNIQUE)</text>
  <rect x="1040" y="292" width="175" height="92" rx="5" class="box"/><rect x="1040" y="292" width="175" height="28" rx="5" class="head"/><text x="1052" y="311" class="name">media_genres</text><text x="1052" y="340" class="pk">PK/FK media_item_id</text><text x="1052" y="361" class="pk">PK/FK genre_id</text>
  <rect x="570" y="345" width="190" height="128" rx="5" class="box"/><rect x="570" y="345" width="190" height="28" rx="5" class="head"/><text x="582" y="364" class="name">media_units</text><text x="582" y="393" class="pk">PK id</text><text x="582" y="414" class="fk">FK media_item_id</text><text x="582" y="435" class="fk">FK parent_unit_id</text><text x="582" y="456" class="field">unit_kind, sequence_number</text>
  <rect x="805" y="365" width="210" height="128" rx="5" class="box"/><rect x="805" y="365" width="210" height="28" rx="5" class="head"/><text x="817" y="384" class="name">library_entries</text><text x="817" y="413" class="pk">PK id</text><text x="817" y="434" class="fk">FK user_id, media_item_id</text><text x="817" y="455" class="fk">FK current_unit_id (nullable)</text><text x="817" y="476" class="field">status, progress_value, rating</text>
  <rect x="1040" y="420" width="175" height="92" rx="5" class="box"/><rect x="1040" y="420" width="175" height="28" rx="5" class="head"/><text x="1052" y="439" class="name">progress_events</text><text x="1052" y="468" class="pk">PK id</text><text x="1052" y="489" class="fk">FK library_entry_id, unit_id</text>

  <rect x="1265" y="105" width="500" height="430" rx="8" class="cluster"/><text x="1282" y="130" class="clusterlabel">External sources and staged import</text>
  <rect x="1290" y="155" width="180" height="115" rx="5" class="box"/><rect x="1290" y="155" width="180" height="28" rx="5" class="head"/><text x="1302" y="174" class="name">sources</text><text x="1302" y="203" class="pk">PK id</text><text x="1302" y="224" class="field">key, name (UNIQUE)</text><text x="1302" y="245" class="field">connector_kind, base_url</text>
  <rect x="1515" y="155" width="210" height="112" rx="5" class="box"/><rect x="1515" y="155" width="210" height="28" rx="5" class="head"/><text x="1527" y="174" class="name">external_mappings</text><text x="1527" y="203" class="pk">PK id</text><text x="1527" y="224" class="fk">FK media_item_id, source_id</text><text x="1527" y="245" class="field">external_id (unique per source)</text>
  <rect x="1290" y="330" width="200" height="138" rx="5" class="box"/><rect x="1290" y="330" width="200" height="28" rx="5" class="head"/><text x="1302" y="349" class="name">ingestion_jobs</text><text x="1302" y="378" class="pk">PK id</text><text x="1302" y="399" class="fk">FK requested_by_user_id</text><text x="1302" y="420" class="fk">FK source_id (nullable)</text><text x="1302" y="441" class="field">kind, status, counts</text>
  <rect x="1530" y="330" width="195" height="155" rx="5" class="box"/><rect x="1530" y="330" width="195" height="28" rx="5" class="head"/><text x="1542" y="349" class="name">ingestion_candidates</text><text x="1542" y="378" class="pk">PK id</text><text x="1542" y="399" class="fk">FK job_id, source_id</text><text x="1542" y="420" class="fk">FK media_type_id</text><text x="1542" y="441" class="fk">FK match_media_id (nullable)</text><text x="1542" y="462" class="field">external_id, decision</text>

  <rect x="500" y="590" width="770" height="250" rx="8" class="cluster"/><text x="517" y="615" class="clusterlabel">Recommendation and cross-cutting entities</text>
  <rect x="625" y="655" width="220" height="125" rx="5" class="box"/><rect x="625" y="655" width="220" height="28" rx="5" class="head"/><text x="637" y="674" class="name">recommendations</text><text x="637" y="703" class="pk">PK id</text><text x="637" y="724" class="fk">FK user_id, media_item_id</text><text x="637" y="745" class="field">score, model_version, feedback</text><text x="637" y="766" class="field">reason, generated_at</text>
  <text x="890" y="705" class="sub">Sessions are maintained in the</text><text x="890" y="730" class="sub">isolated user_sessions table by</text><text x="890" y="755" class="sub">the session middleware.</text>

  <!-- relationship connectors -->
  <path class="line" d="M235 208 H280"/><text x="238" y="198" class="rel">1 : many</text>
  <path class="line" d="M380 305 V345"/><text x="388" y="332" class="rel">1 : many</text>
  <path class="line" d="M760 208 H805"/><text x="764" y="198" class="rel">1 : many</text>
  <path class="line" d="M480 260 C620 290 690 280 805 255"/><text x="620" y="274" class="rel">created by</text>
  <path class="line" d="M1015 220 H1060"/><text x="1017" y="211" class="rel">many : many</text>
  <path class="line" d="M1010 294 C1035 310 1040 325 1040 335"/><text x="980" y="330" class="rel">1 : many</text>
  <path class="line" d="M1060 250 V292"/>
  <path class="line" d="M805 290 C735 318 690 325 665 345"/><text x="700" y="330" class="rel">1 : many</text>
  <path class="line" d="M805 315 V365"/><text x="817" y="343" class="rel">1 : many</text>
  <path class="line" d="M480 280 C600 360 670 415 805 425"/><text x="610" y="395" class="rel">owns</text>
  <path class="line" d="M1015 435 H1040"/><text x="1008" y="421" class="rel">1 : many</text>
  <path class="line" d="M760 420 H805"/><text x="763" y="410" class="rel">current unit</text>
  <path class="line" d="M1470 210 H1515"/><text x="1474" y="200" class="rel">1 : many</text>
  <path class="line" d="M1015 245 C1190 230 1330 230 1515 230"/><text x="1195" y="218" class="rel">mapped by</text>
  <path class="line" d="M1470 250 C1450 285 1410 300 1390 330"/><text x="1400" y="292" class="rel">1 : many</text>
  <path class="line" d="M1490 400 H1530"/><text x="1494" y="390" class="rel">1 : many</text>
  <path class="line" d="M1725 410 C1630 535 1140 600 845 700"/><text x="1220" y="595" class="rel">candidate match</text>
  <path class="line" d="M805 495 C780 565 740 600 735 655"/><text x="748" y="600" class="rel">recommended</text>
  <path class="line" d="M480 455 C550 550 630 605 670 655"/><text x="550" y="570" class="rel">receives</text>

  <text x="55" y="1165" class="sub">Key relationships: Role–User, User–LibraryEntry, MediaType–MediaItem, MediaItem–Genre (through MediaGenre), LibraryEntry–ProgressEvent, Source–ExternalMapping, IngestionJob–IngestionCandidate, and User–Recommendation–MediaItem.</text>
</svg>
