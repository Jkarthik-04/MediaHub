<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1480" viewBox="0 0 2100 1480" role="img" aria-labelledby="title desc">
<title id="title">MediaHub Entity Relationship Diagram</title>
<desc id="desc">ER diagram of all eighteen implemented PostgreSQL tables, their primary and foreign keys, and major cardinalities.</desc>
