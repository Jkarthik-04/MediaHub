<text x="55" y="1330" class="legend" text-anchor="start">Legend  Green PK = primary key   Orange FK = foreign key   PK/FK = identifying relationship   M:N relationships use junction tables</text>
<text x="55" y="1360" class="legend" text-anchor="start">Core paths  users → library_entries → progress_events   media_items ↔ genres   sources → external_mappings   users ↔ sources via user_connections</text>
<text x="55" y="1390" class="legend" text-anchor="start">Delete behavior  personal records generally CASCADE from users   shared catalogue/source references use RESTRICT or SET NULL</text>
