name: mediahub

services:
  postgres:
    image: postgres:17-alpine
    container_name: mediahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediahub}
      POSTGRES_USER: ${POSTGRES_USER:-mediahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediahub_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - mediahub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mediahub-postgres-data:
    name: mediahub-postgres-data
