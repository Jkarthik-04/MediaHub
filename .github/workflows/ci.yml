name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  checks:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://mediahub:mediahub@localhost:5432/mediahub?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mediahub
          POSTGRES_USER: mediahub
          POSTGRES_PASSWORD: mediahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediahub -d mediahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prepare test database
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Run integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check formatting
        run: npm run format:check
